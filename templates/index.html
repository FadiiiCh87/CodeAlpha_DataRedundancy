<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Redundancy Removal</title><link rel="stylesheet" href="/static/style.css"><main><h1>Data Redundancy Removal</h1><p>Submit verified unique records; repeated email addresses are rejected.</p><form id="form"><input name="name" placeholder="Full name" required minlength="2"><input name="email" type="email" placeholder="Email" required><button>Add record</button></form><pre id="result" aria-live="polite"></pre><h2>Recent records</h2><ul id="records"></ul></main><script>async function load(){let r=await fetch('/api/records');let d=await r.json();document.querySelector('#records').replaceChildren(...d.map(x=>{let li=document.createElement('li');li.textContent=x.name+' — '+x.email;return li}))}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);load()};load()</script></html>
